// TICKRATE : réglages d'un match, exécutés par tickrate_match au début de l'échauffement
// (le format vient du mode de jeu : 5v5 = 30 rounds, victoire au 16e ; Wingman = 16 rounds, victoire au 9e)
// pas d'égalité : prolongations de 6 rounds (MR3) jusqu'à ce qu'une équipe gagne
bot_kick
bot_quota 0
bot_chatter off                // coupe le préchargement en RAM des banques vocales radio des bots (~80 Mo gagnés)
sv_forcepreload 0              // ne charge en RAM que les ressources réellement utilisées sur la carte
mp_autokick 0
mp_autoteambalance 0
mp_limitteams 0
mp_overtime_enable 1
mp_overtime_maxrounds 6
bot_controllable 1             // un joueur parti est remplacé par un bot après 2 rounds : ses coéquipiers morts peuvent le prendre (E)
bot_difficulty 2
mp_overtime_startmoney 10000
mp_overtime_limit 0
mp_match_restart_delay 30      // écran de fin 30 s (ELO et drops) ; le plugin vide le serveur 3 s avant la relance
mp_match_can_clinch 1
mp_match_end_restart 0
mp_match_end_changelevel 0
mp_warmuptime 600
mp_warmup_pausetimer 1
mp_halftime 1
mp_friendlyfire 1
sv_allowupload 0               // pas de sprays ni de fichiers envoyés par les joueurs
// votes : seulement les temps morts tactiques (3 par équipe, 30 s), tout le reste est coupé
sv_allow_votes 1
sv_vote_issue_timeout_allowed 1
mp_team_timeout_max 3
mp_team_timeout_time 30
sv_vote_issue_kick_allowed 0
sv_vote_issue_changelevel_allowed 0
sv_vote_issue_nextlevel_allowed 0
sv_vote_issue_restart_game_allowed 0
sv_vote_issue_scramble_teams_allowed 0
sv_vote_issue_swap_teams_allowed 0
sv_vote_issue_surrrender_allowed 0
sv_vote_issue_pause_match_allowed 0
sv_vote_issue_loadbackup_allowed 0
sv_vote_issue_matchready_allowed 0
sv_alltalk 0
sv_deadtalk 0
sv_full_alltalk 0
