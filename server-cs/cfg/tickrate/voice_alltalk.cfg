// =====================================================================
//  TICKRATE — vocal en jeu : TOUT LE MONDE s'entend (alltalk, comme l'ancien CS:GO)
//  À exécuter au lancement du match :  exec tickrate/voice_alltalk.cfg
//  (le plugin / Get5 l'exécutera automatiquement, étape 6)
// =====================================================================
sv_voiceenable 1            // vocal activé sur le serveur
sv_alltalk 1                // les deux équipes peuvent se parler
sv_full_alltalk 1           // lève toutes les restrictions d'équipe (spectateurs compris)
sv_deadtalk 1               // les morts parlent aux vivants
sv_talk_enemy_living 1      // vivants : on entend les adversaires vivants
sv_talk_enemy_dead 1        // morts : on entend les adversaires
sv_auto_full_alltalk_during_warmup_half_end 1   // alltalk aussi en échauffement / mi-temps / fin
say "[TICKRATE] Vocal : tous les joueurs s'entendent (alltalk)"
