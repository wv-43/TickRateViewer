// =====================================================================
//  TICKRATE — vocal en jeu : ÉQUIPE SEULEMENT (règle compétitive classique)
//  exec tickrate/voice_team.cfg
// =====================================================================
sv_voiceenable 1
sv_alltalk 0
sv_full_alltalk 0
sv_deadtalk 0               // les morts ne donnent pas d'infos aux vivants
sv_talk_enemy_living 0
sv_talk_enemy_dead 0
sv_auto_full_alltalk_during_warmup_half_end 1   // tout le monde se parle quand même en échauffement / mi-temps
say "[TICKRATE] Vocal : équipe uniquement"
