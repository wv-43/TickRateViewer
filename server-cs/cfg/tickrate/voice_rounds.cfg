// =====================================================================
//  TICKRATE — vocal en jeu : ÉQUIPE pendant tout le match (les morts parlent à leur équipe),
//  LES DEUX ÉQUIPES seulement à l'échauffement, à la mi-temps (changement de côté) et en fin de match.
//  Nécessite le plugin SourceMod tickrate_voice.smx
//  exec tickrate/voice_rounds.cfg
// =====================================================================
sv_voiceenable 1
sv_auto_full_alltalk_during_warmup_half_end 1
tr_voice_mode rounds
say "[TICKRATE] Vocal : équipe pendant le match, tout le monde à la mi-temps"
